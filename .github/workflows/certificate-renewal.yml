name: TLS Certificate Renewal

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ec2-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  renew-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload certificate maintenance files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy
          target: /tmp/aandi-certificate-maintenance
          overwrite: true

      - name: Install timer and renew certificate
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            bash /tmp/aandi-certificate-maintenance/deploy/scripts/install-certificate-renewal.sh
            if ! sudo systemctl start aandi-certificate-renewal.service; then
              sudo journalctl -u aandi-certificate-renewal.service -n 100 --no-pager
              exit 1
            fi
            sudo journalctl -u aandi-certificate-renewal.service -n 100 --no-pager

      - name: Verify public TLS certificate
        run: |
          set -Eeuo pipefail
          timeout 15 openssl s_client \
            -connect api.aandiclub.com:443 \
            -servername api.aandiclub.com \
            -verify_return_error </dev/null 2>/dev/null |
            openssl x509 -checkend 1209600 -noout

      - name: Verify public blog API
        run: |
          curl --fail --silent --show-error --output /dev/null --max-time 15 \
            --header 'deviceOS: WEB' \
            --header "timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            'https://api.aandiclub.com/v2/blogs?page=0&size=1'
